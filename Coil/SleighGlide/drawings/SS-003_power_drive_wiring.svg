<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="580" fill="#fff"/>
  <rect x="15" y="15" width="870" height="550" fill="none" stroke="#000" stroke-width="2"/>

  <defs>
    <g id="nfet" stroke="#000" stroke-width="1.6" fill="none">
      <line x1="0" y1="0" x2="12" y2="0"/>
      <line x1="12" y1="-14" x2="12" y2="14"/>
      <line x1="18" y1="-16" x2="18" y2="-6"/>
      <line x1="18" y1="-4" x2="18" y2="4"/>
      <line x1="18" y1="6" x2="18" y2="16"/>
      <line x1="18" y1="-13" x2="26" y2="-13"/>
      <line x1="18" y1="13" x2="26" y2="13"/>
      <polygon points="19,13 25,10 25,16" fill="#000" stroke="none"/>
    </g>
  </defs>

  <text x="40" y="45" font-size="15" font-weight="bold">POWER &amp; DRIVE WIRING &#8212; 8-CHANNEL COIL DRIVER (SLEIGH GLIDE)</text>
  <text x="40" y="62" font-size="10.5">IEC 60617 SYMBOLS. CHANNELS 1&#8211;6 OMITTED FOR CLARITY &#8212; IDENTICAL TO CH0 / CH7 (TYP 8 PLACES).</text>

  <!-- ================= ALCHITRY CU ================= -->
  <rect x="60" y="150" width="160" height="280" fill="none" stroke="#000" stroke-width="2"/>
  <text x="140" y="270" font-size="14" font-weight="bold" text-anchor="middle">ALCHITRY CU</text>
  <text x="140" y="288" font-size="11" text-anchor="middle">iCE40 HX8K</text>
  <text x="140" y="304" font-size="11" text-anchor="middle">3.3 V I/O</text>
  <!-- USB power -->
  <rect x="100" y="138" width="36" height="12" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="60" y="128" font-size="10">USB-C &#8592; 5 V WALL ADAPTER (POWER ONLY)</text>
  <!-- pin labels -->
  <text x="214" y="193" font-size="10" text-anchor="end">gates[0]</text>
  <text x="214" y="333" font-size="10" text-anchor="end">gates[7]</text>
  <text x="214" y="423" font-size="10" text-anchor="end">GND</text>
  <text x="240" y="272" font-size="20">&#8942;</text>
  <text x="258" y="268" font-size="9.5">gates[1..6]</text>

  <!-- ================= +24V BUS / GND BUS ================= -->
  <line x1="250" y1="90" x2="830" y2="90" stroke="#000" stroke-width="2"/>
  <text x="252" y="82" font-size="10.5" font-weight="bold">+24 V COIL BUS</text>
  <line x1="220" y1="470" x2="830" y2="470" stroke="#000" stroke-width="2"/>
  <text x="352" y="462" font-size="10">0 V / GND BUS &#8212; SINGLE STAR POINT AT TERMINAL STRIP</text>
  <line x1="220" y1="420" x2="220" y2="470" stroke="#000" stroke-width="1.4"/>

  <!-- ================= CHANNEL 0 ================= -->
  <line x1="220" y1="190" x2="240" y2="190" stroke="#000" stroke-width="1.4"/>
  <rect x="240" y="185" width="30" height="10" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="255" y="179" font-size="9.5" text-anchor="middle">R1 100&#937;</text>
  <line x1="270" y1="190" x2="300" y2="190" stroke="#000" stroke-width="1.4"/>
  <circle cx="300" cy="190" r="2.5" fill="#000"/>
  <!-- pulldown -->
  <line x1="300" y1="190" x2="300" y2="215" stroke="#000" stroke-width="1.4"/>
  <rect x="294" y="215" width="12" height="30" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="312" y="234" font-size="9.5">R2 10 k&#937;</text>
  <line x1="300" y1="245" x2="300" y2="470" stroke="#000" stroke-width="1.4"/>
  <circle cx="300" cy="470" r="2.5" fill="#000"/>
  <!-- mosfet -->
  <use href="#nfet" x="300" y="190"/>
  <text x="332" y="224" font-size="9.5">Q0 IRLZ44N</text>
  <!-- drain up to coil -->
  <line x1="326" y1="177" x2="326" y2="145" stroke="#000" stroke-width="1.4"/>
  <circle cx="326" cy="145" r="2.5" fill="#000"/>
  <path d="M326,145 a5,5.5 0 0 1 0,-11 a5,5.5 0 0 1 0,-11 a5,5.5 0 0 1 0,-11 a5,5.5 0 0 1 0,-11" fill="none" stroke="#000" stroke-width="1.6"/>
  <line x1="326" y1="101" x2="326" y2="90" stroke="#000" stroke-width="1.4"/>
  <circle cx="326" cy="90" r="2.5" fill="#000"/>
  <text x="318" y="118" font-size="9.5" text-anchor="end">L0 &#8594; STATION C0</text>
  <!-- flyback diode -->
  <line x1="326" y1="145" x2="380" y2="145" stroke="#000" stroke-width="1.4"/>
  <line x1="380" y1="145" x2="380" y2="128" stroke="#000" stroke-width="1.4"/>
  <polygon points="372,128 388,128 380,116" fill="none" stroke="#000" stroke-width="1.4"/>
  <line x1="372" y1="116" x2="388" y2="116" stroke="#000" stroke-width="2"/>
  <line x1="380" y1="116" x2="380" y2="90" stroke="#000" stroke-width="1.4"/>
  <circle cx="380" cy="90" r="2.5" fill="#000"/>
  <text x="392" y="124" font-size="9.5">D0 1N5408</text>
  <!-- source down -->
  <line x1="326" y1="203" x2="326" y2="470" stroke="#000" stroke-width="1.4"/>
  <circle cx="326" cy="470" r="2.5" fill="#000"/>

  <!-- ================= CHANNEL 7 ================= -->
  <line x1="220" y1="330" x2="240" y2="330" stroke="#000" stroke-width="1.4"/>
  <rect x="240" y="325" width="30" height="10" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="255" y="319" font-size="9.5" text-anchor="middle">R15 100&#937;</text>
  <line x1="270" y1="330" x2="468" y2="330" stroke="#000" stroke-width="1.4"/>
  <circle cx="468" cy="330" r="2.5" fill="#000"/>
  <line x1="468" y1="330" x2="468" y2="355" stroke="#000" stroke-width="1.4"/>
  <rect x="462" y="355" width="12" height="30" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="480" y="374" font-size="9.5">R16 10 k&#937;</text>
  <line x1="468" y1="385" x2="468" y2="470" stroke="#000" stroke-width="1.4"/>
  <circle cx="468" cy="470" r="2.5" fill="#000"/>
  <use href="#nfet" x="468" y="330"/>
  <text x="500" y="364" font-size="9.5">Q7 IRLZ44N</text>
  <line x1="494" y1="317" x2="494" y2="145" stroke="#000" stroke-width="1.4"/>
  <circle cx="494" cy="145" r="2.5" fill="#000"/>
  <path d="M494,145 a5,5.5 0 0 1 0,-11 a5,5.5 0 0 1 0,-11 a5,5.5 0 0 1 0,-11 a5,5.5 0 0 1 0,-11" fill="none" stroke="#000" stroke-width="1.6"/>
  <line x1="494" y1="101" x2="494" y2="90" stroke="#000" stroke-width="1.4"/>
  <circle cx="494" cy="90" r="2.5" fill="#000"/>
  <text x="486" y="118" font-size="9.5" text-anchor="end">L7 &#8594; STATION C7</text>
  <line x1="494" y1="145" x2="548" y2="145" stroke="#000" stroke-width="1.4"/>
  <line x1="548" y1="145" x2="548" y2="128" stroke="#000" stroke-width="1.4"/>
  <polygon points="540,128 556,128 548,116" fill="none" stroke="#000" stroke-width="1.4"/>
  <line x1="540" y1="116" x2="556" y2="116" stroke="#000" stroke-width="2"/>
  <line x1="548" y1="116" x2="548" y2="90" stroke="#000" stroke-width="1.4"/>
  <circle cx="548" cy="90" r="2.5" fill="#000"/>
  <text x="560" y="124" font-size="9.5">D7 1N5408</text>
  <line x1="494" y1="343" x2="494" y2="470" stroke="#000" stroke-width="1.4"/>
  <circle cx="494" cy="470" r="2.5" fill="#000"/>

  <!-- ================= BULK CAP ================= -->
  <line x1="690" y1="90" x2="690" y2="250" stroke="#000" stroke-width="1.4"/>
  <circle cx="690" cy="90" r="2.5" fill="#000"/>
  <line x1="678" y1="250" x2="702" y2="250" stroke="#000" stroke-width="2"/>
  <path d="M678,262 Q690,270 702,262" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="690" y1="264" x2="690" y2="470" stroke="#000" stroke-width="1.4"/>
  <circle cx="690" cy="470" r="2.5" fill="#000"/>
  <text x="668" y="246" font-size="11">+</text>
  <text x="560" y="258" font-size="9.5">C9  2200 &#181;F 35 V (AT MOSFETS)</text>

  <!-- ================= BATTERY ================= -->
  <line x1="790" y1="90" x2="790" y2="255" stroke="#000" stroke-width="1.4"/>
  <circle cx="790" cy="90" r="2.5" fill="#000"/>
  <line x1="775" y1="255" x2="805" y2="255" stroke="#000" stroke-width="2.2"/>
  <line x1="783" y1="265" x2="797" y2="265" stroke="#000" stroke-width="1.4"/>
  <line x1="775" y1="275" x2="805" y2="275" stroke="#000" stroke-width="2.2"/>
  <line x1="783" y1="285" x2="797" y2="285" stroke="#000" stroke-width="1.4"/>
  <line x1="790" y1="285" x2="790" y2="470" stroke="#000" stroke-width="1.4"/>
  <circle cx="790" cy="470" r="2.5" fill="#000"/>
  <text x="798" y="250" font-size="11">+</text>
  <text x="812" y="262" font-size="9.5">BT1</text>
  <text x="812" y="275" font-size="9.5">16 &#215; AA</text>
  <text x="812" y="288" font-size="9.5">&#8776;24 V</text>

  <!-- ================= NOTES ================= -->
  <g font-size="10.5">
    <text x="35" y="500" font-weight="bold" font-size="12">NOTES</text>
    <text x="35" y="516">1.  CHANNELS 1&#8211;6 IDENTICAL TO CH0 / CH7 (TYP 8 PLACES).</text>
    <text x="35" y="531">2.  D0&#8211;D7: 1N5408, CATHODE (STRIPE) TO +24 V BUS. GATE 100 &#937; SERIES, 10 k&#937; PULLDOWN.</text>
    <text x="35" y="546">3.  FPGA IS USB-POWERED ONLY &#8212; NO 24 V CONNECTION TO THE BOARD. GND IS THE ONLY SHARED NET.</text>
    <text x="35" y="561">4.  WIRE CROSSING WITHOUT DOT = NO CONNECTION. KEEP 24 V AND GATE WIRING PHYSICALLY SEPARATED.</text>
  </g>

  <!-- ================= TITLE BLOCK ================= -->
  <g stroke="#000" stroke-width="1.4" fill="none">
    <rect x="455" y="480" width="430" height="85"/>
    <line x1="455" y1="508" x2="885" y2="508"/>
    <line x1="455" y1="536" x2="885" y2="536"/>
    <line x1="650" y1="480" x2="650" y2="565"/>
    <line x1="770" y1="480" x2="770" y2="565"/>
  </g>
  <text x="463" y="494" font-size="9">TITLE</text>
  <text x="463" y="529" font-size="13" font-weight="bold">POWER &amp; DRIVE WIRING &#8212; SLEIGH GLIDE</text>
  <text x="658" y="494" font-size="9">DRAWING NO.</text>
  <text x="736" y="497" font-size="12" font-weight="bold">SS-003</text>
  <text x="778" y="494" font-size="9">SHEET</text>
  <text x="815" y="497" font-size="11">1 / 1</text>
  <text x="463" y="551" font-size="9">DRAWN</text>
  <text x="500" y="553" font-size="10">CLAUDE / CLEMENTS VILLAGE WORKS</text>
  <text x="658" y="522" font-size="9">SCALE</text>
  <text x="692" y="524" font-size="10">NTS</text>
  <text x="658" y="551" font-size="9">REF</text>
  <text x="692" y="553" font-size="10">SS-001, SS-002</text>
  <text x="778" y="522" font-size="9">SYMBOLS: IEC 60617</text>
  <text x="778" y="551" font-size="9">PRESENTATION: ISO 128</text>
</svg>

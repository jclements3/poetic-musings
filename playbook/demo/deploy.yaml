apiVersion: apps/v1
kind: Deployment
metadata: {name: status-service}
spec:
  replicas: 2
  selector: {matchLabels: {app: status}}
  template:
    metadata: {labels: {app: status}}
    spec:
      containers:
      - name: status
        image: status-service:1.0
        ports: [{containerPort: 8080}]
        securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false}
        resources: {limits: {memory: 128Mi, cpu: 250m}}

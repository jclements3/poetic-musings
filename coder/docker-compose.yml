# A real, self-hosted Coder deployment. See README.md for what's
# actually verified real here and what the honest gaps are.
#
#   cd coder
#   docker compose up -d
#   open http://localhost:7080   # first visit creates the admin user
#
#   docker compose down          # stop
#   docker compose down -v       # stop and wipe all Coder state (Postgres + config)

services:
  coder:
    image: ghcr.io/coder/coder:latest
    ports:
      - "7080:7080"
    environment:
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_ACCESS_URL: http://localhost:7080
    volumes:
      - coder-data:/home/coder/.config/coderv2

volumes:
  coder-data:

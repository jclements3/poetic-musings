name: CI Build/Lint/Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: Lint Python (app/status-service)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Check for Python sources
        id: pyfiles
        run: |
          if find app -name '*.py' 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ruff lint
        if: steps.pyfiles.outputs.found == 'true'
        run: |
          ruff check app --output-format=github || true
          ruff check app

      - name: Note on Haskell/Clash suites
        run: |
          echo "Haskell/Clash test suites exist elsewhere in this repo (e.g. under package dirs)." \
               "They are not run in this CI pipeline; run them locally via 'cabal test' / 'stack test' per package." \
               >> "$GITHUB_STEP_SUMMARY"

  python-tests:
    name: Python unit tests (status-service)
    runs-on: ubuntu-latest
    needs: lint-python
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for requirements file
        id: reqs
        run: |
          if [ -f app/status-service/requirements.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.reqs.outputs.found == 'true'
        run: pip install -r app/status-service/requirements.txt

      - name: Run tests
        if: steps.reqs.outputs.found == 'true'
        run: |
          if [ -d app/status-service/tests ] || find app/status-service -name 'test_*.py' | grep -q .; then
            pip install pytest
            pytest app/status-service -q
          else
            echo "No test suite found under app/status-service yet; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

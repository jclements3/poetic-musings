apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: status-service-prod

resources:
  - ../../base

images:
  - name: status-service
    newName: ghcr.io/jclements3/status-service
    newTag: "1.0.0"

patches:
  - target:
      kind: Deployment
      name: status-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: status-service-dev

resources:
  - ../../base

images:
  - name: status-service
    newName: status-service
    newTag: demo

patches:
  - target:
      kind: Deployment
      name: status-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: PodDisruptionBudget
      name: status-service
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
